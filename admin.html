<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>교재의 숲 · 씨앗 검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one column of review cards; each card = the request on the left, duplicate evidence and actions on the right */
:root{
  --bg:#EEF6E6; --surface:#FFFBF0; --surface-2:#F4EBD4; --line:#E6D6B4; --edge:#E0CBA0; --ink:#4B3A28; --muted:#87745B;
  --leaf:#6CC47E; --leaf-edge:#2F7E47; --heart:#FF6F91; --heart-soft:#FFE2EA; --making:#E2902A; --making-soft:#FFEFD2; --warn:#D9534F; --warn-soft:#FDE3E1;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
h1{font-size:30px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:16px}
.who{font-size:13px;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--heart);outline-offset:2px;border-radius:8px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:700;box-shadow:0 3px 0 var(--edge)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.ok{background:var(--leaf);border-color:var(--leaf-edge);color:#fff;box-shadow:0 3px 0 var(--leaf-edge)}
.btn.no{background:var(--surface);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--edge);padding:16px}
.login{max-width:380px;margin:60px auto;display:grid;gap:12px}
.login label{display:grid;gap:4px;font-size:13px;font-weight:700}
.field{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;width:100%}
.msg{font-size:13px;color:var(--warn)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-family:var(--display);font-size:17px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf-edge);color:#fff}
.tab b{font-family:var(--body);font-size:13px;margin-left:4px}
.list{display:grid;gap:12px}
.req{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:760px){.req{grid-template-columns:1fr}}
.req h3{font-size:20px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin:4px 0 8px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--surface-2)}
.pill.c{background:#E3F4E5;color:var(--leaf-edge)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.h{background:var(--heart-soft);color:var(--heart)}
.kb{display:inline-block;font-weight:700;color:var(--leaf-edge)}
.kbid{font-size:12px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.masked{font-size:13px;color:var(--muted)}
.dups{display:grid;gap:8px;align-content:start}
.dup{border-radius:14px;padding:8px 10px;background:var(--surface-2);font-size:13.5px}
.dup.strong{background:var(--warn-soft)}
.dup b{font-weight:700}
.dup ul{margin:4px 0 0;padding-left:18px}
.ok-note{font-size:13px;color:var(--leaf-edge);background:#E3F4E5;border-radius:14px;padding:8px 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.actions select,.actions input{border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:#fff;min-width:0;max-width:100%}
.empty{text-align:center;color:var(--muted);padding:36px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{background:var(--making-soft);color:var(--making);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>씨앗 검토</h1>
    <div class="who"><span id="who"></span> <button class="btn" id="refresh" hidden>새로 고침</button> <button class="btn" id="logout" hidden>로그아웃</button></div>
  </div>
  <div class="demo" id="demo" hidden>config.js 에 Supabase 정보가 없어서 <b>데모 데이터</b>로 보여요. 승인·반려가 실제로 저장되지 않아요.</div>

  <form class="card login" id="login" hidden>
    <h2>관리자 로그인</h2>
    <label>이메일<input class="field" id="email" type="email" autocomplete="username" required></label>
    <label>비밀번호<input class="field" id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn ok" type="submit">로그인</button>
    <div class="msg" id="login-msg"></div>
  </form>

  <div class="card" id="notadmin" hidden>
    <h2>관리자로 등록되지 않은 계정이에요</h2>
    <p>Supabase SQL Editor 에서 아래 한 줄을 실행한 뒤 새로 고침하세요.</p>
    <pre id="notadmin-sql" style="white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:12px;font-size:13px"></pre>
  </div>

  <main id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="pending" aria-selected="true">검토 대기<b id="n-pending"></b></button>
      <button class="tab" role="tab" data-t="approved" aria-selected="false">숲에 심음<b id="n-approved"></b></button>
      <button class="tab" role="tab" data-t="closed" aria-selected="false">반려·합침<b id="n-closed"></b></button>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CFG = window.TF_CONFIG || {};
const KYOBO_RE = /^https?:\/\/(?:[a-z.]*\.)?kyobobook\.co\.kr\//;
let toastT; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }

/* ---------- matching helpers (same rules as the main page) ---------- */
const norm = s => String(s).replace(/\s+/g, "").toLowerCase();
const chosung = c => /^[가-힣]$/.test(c) ? "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"[Math.floor((c.charCodeAt(0) - 0xAC00) / 588)] : c;
const chMatch = (m, c) => m === "*" || m === c || (/[ㄱ-ㅎ]/.test(m) && chosung(c) === m);
function containsMasked(title, masked){
  const t = norm(title), m = norm(masked);
  for (let i = 0; i + m.length <= t.length; i++){ let ok = true; for (let j = 0; j < m.length; j++) if (!chMatch(m[j], t[i + j])) { ok = false; break; } if (ok) return true; }
  return false;
}
/* title similarity: shared character pairs, ignoring spaces, editions and generic words */
const core = s => norm(s).replace(/\(.*?\)|\[.*?\]/g, "").replace(/(중등|중학|고등|수학|개정|문제집|년|판)/g, "");
function similar(a, b){
  const bg = s => { const x = core(s), out = new Set(); for (let i = 0; i < x.length - 1; i++) out.add(x.slice(i, i + 2)); return out; };
  const A = bg(a), B = bg(b); if (!A.size || !B.size) return 0;
  let n = 0; A.forEach(x => { if (B.has(x)) n++; });
  return 2 * n / (A.size + B.size);
}

/* ---------- data source: Supabase, or demo data ---------- */
let api, D = {requests: [], books: [], counts: {}}, TAB = "pending";
function supa(){
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  const rpc = async (fn, args) => { const {data, error} = await sb.rpc(fn, args || {}); if (error) throw error; return data; };
  return {
    sb, demo: false,
    async session(){ const {data} = await sb.auth.getSession(); const s = data.session; return s && !s.user.is_anonymous ? s : null; },
    async login(email, pw){ const {data, error} = await sb.auth.signInWithPassword({email, password: pw}); if (error) throw error; return data.session; },
    logout: () => sb.auth.signOut(),
    isAdmin: () => rpc("tf_is_admin"),
    load: () => rpc("tf_admin_data"),
    review: (id, action, target, note) => rpc("tf_admin_review", {p_id: id, p_action: action, p_target: target || null, p_note: note || null}),
  };
}
function demo(){
  const now = Date.now();
  const data = {
    books: [{id: "lightssen-m21", t: "라이트ㅆ", c: "중2-1", s: "making"}, {id: "rpm-m11", t: "R*M", c: "중1-1", s: "released"}, {id: "choisang-m22", t: "최*위수학", c: "중2-2", s: "making"}],
    counts: {},
    requests: [
      {id: "r-1", title: "라이트쎈 중등 수학 2-1(2026)", masked: "라*트쎈 중등 수학 2-1(2026)", publisher: "좋은책신사고", course: "중2-1", url: "https://product.kyobobook.co.kr/detail/S000213456789", kyoboId: "S000213456789", status: "pending", hearts: 3, byCount: 1, createdAt: new Date(now - 3600e3).toISOString()},
      {id: "r-2", title: "우공비Q+Q 중등 수학 1-1 기본실전", masked: "우*비Q+Q 중등 수학 1-1 기본실전", publisher: "좋은책신사고", course: "중1-1", url: "https://product.kyobobook.co.kr/detail/S000215550000", kyoboId: "S000215550000", status: "pending", hearts: 1, byCount: 2, createdAt: new Date(now - 7200e3).toISOString()},
      {id: "r-3", title: "우공비 Q+Q 중학수학 1-1", masked: "우*비 Q+Q 중학수학 1-1", publisher: "신사고", course: "중1-1", url: "https://product.kyobobook.co.kr/detail/S000215559999", kyoboId: "S000215559999", status: "approved", hearts: 6, byCount: 1, createdAt: new Date(now - 86400e3).toISOString()},
    ]};
  return {
    demo: true,
    session: async () => ({user: {email: "demo@example.com", id: "demo"}}),
    login: async () => ({}), logout: async () => {}, isAdmin: async () => true,
    load: async () => JSON.parse(JSON.stringify(data)),
    review: async (id, action, target, note) => {
      const r = data.requests.find(x => x.id === id);
      r.status = {approve: "approved", reject: "rejected", merge: "merged", reopen: "pending"}[action];
      r.note = note || null; r.mergedInto = target || null;
    },
  };
}

/* ---------- screens ---------- */
async function start(){
  api = CFG.supabaseUrl && CFG.supabaseKey && window.supabase ? supa() : demo();
  $("#demo").hidden = !api.demo;
  const s = await api.session().catch(() => null);
  if (!s){ $("#login").hidden = false; return; }
  await enter(s);
}
async function enter(s){
  $("#login").hidden = true;
  $("#who").textContent = (s.user && s.user.email) || "";
  $("#logout").hidden = false; $("#refresh").hidden = false;
  if (!(await api.isAdmin().catch(() => false))){
    $("#notadmin").hidden = false;
    $("#notadmin-sql").textContent = `insert into public.tf_admins (user_id) values ('${s.user.id}');`;
    return;
  }
  $("#app").hidden = false;
  await reload();
  setInterval(() => { if (!document.hidden && !document.querySelector(".actions :focus")) reload(); }, 30000);
}
$("#login").addEventListener("submit", async e => {
  e.preventDefault(); $("#login-msg").textContent = "";
  try { const s = await api.login($("#email").value.trim(), $("#pw").value); await enter(s); }
  catch (err){ $("#login-msg").textContent = "이메일 또는 비밀번호를 확인해 주세요."; }
});
$("#logout").onclick = async () => { await api.logout(); location.reload(); };
$("#refresh").onclick = () => reload().then(() => toast("새로 고쳤어요"));
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { TAB = b.dataset.t; document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b)); render(); });

async function reload(){
  try { D = await api.load(); render(); }
  catch (e){ toast("불러오지 못했어요: " + (e.message || e)); }
}

/* evidence that a pending request duplicates something */
function evidence(r){
  const others = D.requests.filter(x => x.id !== r.id);
  const sameProduct = others.filter(x => x.kyoboId === r.kyoboId);
  const forest = (D.books || []).filter(b => b.c === r.course && containsMasked(r.title, b.t));
  const similarReqs = others.filter(x => x.course === r.course && x.kyoboId !== r.kyoboId && ["pending", "approved"].includes(x.status) && similar(r.title, x.title) >= 0.5)
    .sort((a, b) => similar(r.title, b.title) - similar(r.title, a.title));
  return {sameProduct, forest, similarReqs};
}
const ST = {pending: "검토 대기", approved: "숲에 심음", rejected: "반려", merged: "합침"};
const when = iso => { try { return new Date(iso).toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}); } catch { return ""; } };
function bookName(id){
  const b = (D.books || []).find(x => x.id === id); if (b) return `${b.t} ${b.c} (${b.s === "released" ? "열매" : "제작 중"})`;
  const r = D.requests.find(x => x.id === id); return r ? `${r.title} ${r.course} (요청)` : id;
}

function render(){
  const R = D.requests || [];
  const groups = {pending: R.filter(r => r.status === "pending"), approved: R.filter(r => r.status === "approved"), closed: R.filter(r => r.status === "rejected" || r.status === "merged")};
  $("#n-pending").textContent = groups.pending.length; $("#n-approved").textContent = groups.approved.length; $("#n-closed").textContent = groups.closed.length;
  const list = groups[TAB];
  if (!list.length){ $("#list").innerHTML = `<div class="card empty">${TAB === "pending" ? "검토할 씨앗이 없어요." : "아직 없어요."}</div>`; return; }
  $("#list").innerHTML = list.map(r => {
    const link = KYOBO_RE.test(r.url) ? `<a class="kb" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">교보문고에서 확인 ↗</a>` : `<span class="pill warn">링크 형식 확인 필요</span>`;
    const left = `<div><h3>${esc(r.title)}</h3>
      <div class="meta"><span class="pill c">${esc(r.course)}</span><span>${esc(r.publisher)}</span><span class="pill h">♥ ${r.hearts || 0}</span><span>${when(r.createdAt)}</span>${r.byCount > 5 ? `<span class="pill warn">이 사람 요청 ${r.byCount}개</span>` : ""}</div>
      <div class="masked">화면 표시: ${esc(r.masked)}</div>
      <div style="margin-top:6px">${link} <span class="kbid">${esc(r.kyoboId)}</span></div>
      ${r.status !== "pending" ? `<div class="meta" style="margin-top:8px"><span class="pill">${ST[r.status]}</span>${r.mergedInto ? `<span>→ ${esc(bookName(r.mergedInto))}</span>` : ""}${r.note ? `<span>사유: ${esc(r.note)}</span>` : ""}</div>` : ""}
    </div>`;
    let right = "";
    if (r.status === "pending"){
      const ev = evidence(r);
      const strong = ev.sameProduct.length || ev.forest.length;
      const items = [];
      if (ev.sameProduct.length) items.push(`<div class="dup strong"><b>같은 교보문고 상품</b><ul>${ev.sameProduct.map(x => `<li>${esc(x.title)} · ${ST[x.status]}</li>`).join("")}</ul></div>`);
      if (ev.forest.length) items.push(`<div class="dup strong"><b>숲에 이미 있는 교재와 이름이 겹쳐요</b><ul>${ev.forest.map(b => `<li>${esc(b.t)} ${esc(b.c)} · ${b.s === "released" ? "열매(출시)" : "제작 중"}</li>`).join("")}</ul></div>`);
      if (ev.similarReqs.length) items.push(`<div class="dup"><b>비슷한 이름의 요청</b><ul>${ev.similarReqs.slice(0, 4).map(x => `<li>${esc(x.title)} · ${ST[x.status]} · 비슷함 ${Math.round(similar(r.title, x.title) * 100)}%</li>`).join("")}</ul></div>`);
      if (!items.length) items.push(`<div class="ok-note">겹치는 교재를 찾지 못했어요. 교보문고 링크만 확인하면 돼요.</div>`);
      const targets = [...ev.forest.map(b => [b.id, bookName(b.id)]), ...ev.sameProduct.concat(ev.similarReqs).filter(x => x.status === "approved").map(x => [x.id, bookName(x.id)]),
        ...(D.books || []).filter(b => b.c === r.course && !ev.forest.includes(b)).map(b => [b.id, bookName(b.id)]),
        ...R.filter(x => x.status === "approved" && x.course === r.course && x.id !== r.id).map(x => [x.id, bookName(x.id)])];
      const seen = new Set(), opts = targets.filter(([id]) => !seen.has(id) && seen.add(id));
      right = `<div class="dups">${items.join("")}
        <div class="actions">
          <button class="btn ok" data-act="approve" data-id="${esc(r.id)}" ${strong ? "" : ""}>승인 · 숲에 심기</button>
          <select data-reason="${esc(r.id)}" aria-label="반려 사유">
            <option>교보문고 링크가 다른 책이에요</option><option>이미 숲에 있는 교재예요</option><option>중·고등 수학 교재가 아니에요</option><option>과목이 맞지 않아요</option>
          </select>
          <button class="btn no" data-act="reject" data-id="${esc(r.id)}">반려</button>
        </div>
        ${opts.length ? `<div class="actions"><select data-target="${esc(r.id)}" aria-label="합칠 교재">${opts.map(([id, n]) => `<option value="${esc(id)}">${esc(n)}</option>`).join("")}</select>
          <button class="btn" data-act="merge" data-id="${esc(r.id)}">이 교재로 합치기</button></div>` : ""}
      </div>`;
    } else {
      right = `<div class="dups"><div class="actions">
        <button class="btn" data-act="reopen" data-id="${esc(r.id)}">다시 검토 대기로</button>
        ${r.status === "approved" ? `<button class="btn no" data-act="reject" data-id="${esc(r.id)}">숲에서 빼기(반려)</button>` : ""}
      </div></div>`;
    }
    return `<article class="card req">${left}${right}</article>`;
  }).join("");
}

$("#list").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  const reasonSel = document.querySelector(`[data-reason="${CSS.escape(id)}"]`), targetSel = document.querySelector(`[data-target="${CSS.escape(id)}"]`);
  const note = act === "reject" ? (reasonSel ? reasonSel.value : "숲에서 뺐어요") : null;
  const target = act === "merge" ? (targetSel && targetSel.value) : null;
  b.disabled = true;
  try {
    await api.review(id, act, target, note);
    toast({approve: "숲에 심었어요 🌱", reject: "반려했어요", merge: "합쳤어요. 하트도 옮겼어요", reopen: "검토 대기로 돌렸어요"}[act]);
    await reload();
  } catch (err){ b.disabled = false; toast(err.message || "처리하지 못했어요"); }
});
start();
</script>
</body>
</html>
